name: CI / Enterprise Cloud Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test, Secret Scan & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pre-Flight Repository Secret Scan
        run: |
          echo "🔍 Scanning tracked repository files for prohibited secrets..."
          # Verify that sensitive files are NOT tracked in git
          if git ls-files | grep -E '(^|\/)(data\/|\.env$|\.env\.local|\.sqlite|\.pem$|\.key$|license-keys\.json)'; then
            echo "❌ CRITICAL SECURITY ERROR: Prohibited secret or database file found in git index!"
            exit 1
          fi
          echo "✅ Repository git index is clean of private keys and local databases."

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Run Vitest Automated Test Suite
        run: npx vitest run

      - name: Production Bundle Build (Vite SingleFile)
        run: npm run build

      - name: Verify Distribution Artifact
        run: |
          test -f dist/index.html
          echo "✅ Build artifact verified: dist/index.html exists and is ready for Vercel."

      - name: Post-Build Secret Leakage Check
        run: |
          echo "🔍 Verifying the production bundle is free of private keys, passwords, session secrets, and provider tokens..."
          # المرحلة 1: فحص موسّع — لا بصمة مفتاح مسرب في ملف CI نفسه، ولا أي سر معروف يدخل الحزمة
          if grep -E 'BEGIN PRIVATE KEY|BEGIN RSA PRIVATE KEY' dist/index.html; then
            echo "❌ SECURITY FAILURE: Private key material leaked into frontend bundle!"
            exit 1
          fi
          if grep -E 'Admin@PhotoFinish2026|Saida2026|pfp_sec_session_k92|offline-standalone-admin-session' dist/index.html; then
            echo "❌ SECURITY FAILURE: Known credential literal leaked into frontend bundle!"
            exit 1
          fi
          if grep -E 'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|VITE_LICENSE_PRIVATE_KEY|VITE_ADMIN_PORTAL_PASSWORD' dist/index.html; then
            echo "❌ SECURITY FAILURE: Provider token or secret env reference leaked into frontend bundle!"
            exit 1
          fi
          if grep -E 'PFP2-[A-Z0-9]{4}-[0-9]{4}-(POOL|GLBL|GLOBAL)' dist/index.html; then
            echo "❌ SECURITY FAILURE: License code material leaked into frontend bundle!"
            exit 1
          fi
          echo "✅ Production bundle passed zero-secret verification (keys, passwords, session secrets, tokens, license codes)."
